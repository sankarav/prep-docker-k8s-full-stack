apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  labels:
    app: full-stack
    app-module: postgres-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: full-stack
      app-module: postgres-db
  template:
    metadata:
      name: postgres-db
      labels:
        app: full-stack
        app-module: postgres-db
    spec:
      containers:
        - name: postgres
          image: postgres
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  key: POSTGRES_DB
                  name: full-stack-config-map
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: full-stack-config-map
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: full-stack-secret
                  key: POSTGRES_PASSWORD